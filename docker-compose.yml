services:
  ui:
    container_name: music-ui
    build: .
    restart: unless-stopped
    ports: ["47213:3000"]
    environment:
      DATABASE_URL: postgres://music:music@db:5432/music
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      NAVIDROME_URL: ${NAVIDROME_URL:-}
      ORIGIN: http://localhost:47213
      COOKIE_SECURE: "false"
    depends_on: [db]
  db:
    container_name: music-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: music
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
