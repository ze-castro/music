# Server deployment. Pulls the image built by GitHub Actions; no source needed.
# Put this file + a .env next to it, then: docker compose up -d
services:
  ui:
    container_name: music-ui
    image: ghcr.io/ze-castro/music:latest
    restart: unless-stopped
    ports: ["47213:3000"]
    environment:
      DATABASE_URL: postgres://music:music@db:5432/music
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      NAVIDROME_URL: ${NAVIDROME_URL:-}
      ORIGIN: ${ORIGIN}
      COOKIE_SECURE: "true"
    depends_on: [db]
  db:
    container_name: music-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: music
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata: