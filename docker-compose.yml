# Local development (builds from source). Server: deploy/docker-compose.yml
services:
  music:
    container_name: music
    build: .
    restart: unless-stopped
    ports: ['47213:3000']
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      NAVIDROME_URL: ${NAVIDROME_URL:-}
      ORIGIN: http://localhost:47213
      COOKIE_SECURE: 'false'
    volumes: [music-data:/data]
volumes:
  music-data: