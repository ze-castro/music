# Server deployment. Pulls the image built by GitHub Actions; no source needed.
# Put this file + a .env next to it, then: docker compose up -d
services:
  music:
    container_name: music
    image: ghcr.io/ze-castro/music:latest
    restart: unless-stopped
    ports: ['47213:3000']
    networks: [default, navidrome] # remove `navidrome` + the networks block below if Navidrome isn't in Docker
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      NAVIDROME_URL: ${NAVIDROME_URL:-}
      ORIGIN: ${ORIGIN}
      COOKIE_SECURE: 'true'
    volumes: [./data:/data] # SQLite lives here; back this folder up
networks:
  navidrome:
    external: true
    name: navidrome_default # docker network ls
